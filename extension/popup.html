<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="icon.png" alt="Logo" class="logo-img">
      <span class="logo-text">read<span class="highlight">.it</span></span>
    </div>
  </div>

  <div class="content">
    <div class="description">
      Highlight text on any webpage to speak it aloud, summarize it, or discuss details using Gemini AI.
    </div>

    <!-- API Key Input -->
    <div class="card">
      <div class="card-title">Gemini API Configuration</div>
      <div class="input-group">
        <input type="password" id="api-key" placeholder="Enter Gemini API Key..." />
        <button id="save-btn">Save Key</button>
      </div>
      <div class="status-msg" id="status-msg"></div>
    </div>

    <!-- Actions -->
    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px;">
      <button class="primary-btn" id="open-reader-btn">Open Web Document Reader</button>
    </div>
  </div>

  <div class="footer">
    read.it extension &copy; 2026
  </div>

  <script src="popup.js"></script>
</body>
</html>
